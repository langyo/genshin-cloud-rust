[workspace]
members = ["packages/*"]

default-members = ["packages/router"]
resolver = "2"

[profile.release]
lto = true
opt-level = 'z'
codegen-units = 1
panic = "abort"

[workspace.package]
authors = ["langyo <langyo.china@gmail.com>"]
publish = false

version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = { version = "^1", features = ["backtrace"] }
async-trait = "^0.1"
derive_more = { version = "^2", features = ["full"] }
once_cell = "^1"

base64 = "^0.22"
bytes = "^1"
chrono = { version = "^0.4", features = ["serde", "unstable-locales"] }
percent-encoding = "^2"

flume = "^0.12"
futures = "^0.3"
oneshot = "^0.2"
tokio = { version = "^1", features = ["full"] }

serde = { version = "^1", features = ["derive"] }
serde_json = "^1"
# strum 0.27+ requires sea-orm 2.0. While sea-orm 2.0-rc exists, it breaks
# ~33 business call sites (the SafeEntityTrait macro + all *.exec() consumers).
# The 2.0 migration is tracked as follow-up work; pin strum to the 0.26 line
# that sea-orm 1.x supports until the dev branch ports the call sites.
strum = { version = "^0.26", features = ["derive"] }
uuid = { version = "^1", features = [
  'v4',
  "v7",
  'fast-rng',
  'macro-diagnostics',
  'serde',
] }
yuuka = "^0.6"

image = { version = "^0.25", features = ["gif", "jpeg", "png", "webp"] }
sqids = "^0.4"
bzip2 = "^0.6"

bcrypt = "^0.19"
jsonwebtoken = "^10"

md5 = "^0.8"

env_logger = "^0.11"
log = "^0.4"
tracing = "^0.1"
tracing-appender = "^0.2"
tracing-subscriber = { version = "^0.3", features = ["env-filter"] }

axum = { version = "^0.8", features = [
  "macros",
  "json",
  "query",
  "multipart",
  "ws",
] }
axum-extra = { version = "^0.12", features = [
  "typed-header",
  "query",
  "multipart",
  "cookie",
] }
# reqwest: deliberately avoid the default `rustls`/`default-tls` features,
# which would pull `__rustls-aws-lc-rs` and force the aws-lc-rs crypto provider
# (and its native aws-lc-sys C build) onto the whole graph via feature
# unification. `rustls-no-provider` gives us the rustls transport without
# committing to a provider; the ring provider is activated by the explicit
# `rustls` workspace dep below, which uses `default-features = false`.
reqwest = { version = "^0.13", default-features = false, features = [
  "charset",
  "http2",
  "rustls-no-provider",
  "rustls-native-certs",
  "cookies",
  "gzip",
  "brotli",
  "json",
  "multipart",
] }
# rustls: pinned ring-only. default-features = false drops aws-lc-rs from the
# default feature set; we re-enable only what we need (std, tls12, logging).
# This is the single source of truth for the rustls crypto provider across
# the whole workspace (reqwest + sqlx/sea-orm both ride on this via
# unification).
rustls = { version = "^0.23", default-features = false, features = [
  "ring",
  "std",
  "tls12",
  "logging",
] }
tower-http = { version = "^0.7", features = ["fs", "trace"] }

# sea-orm: kept on the 1.x stable line for now. sea-orm 2.0-rc is available
# but introduces a breaking UpdateOne/ValidatedUpdateOne API that requires
# porting the SafeEntityTrait macro (packages/utils/src/db_operations.rs) and
# ~33 business call sites in packages/functions. That migration is scheduled
# as follow-up work on the dev branch. Move to "^2.0.0-rc" once ported.
sea-orm = { version = "^1", features = [
  "debug-print",
  "json-array",
  "sqlx-postgres",
  "runtime-tokio-rustls",
] }
# redis 1.x graduated to stable (the 0.x line is the legacy async API).
redis = { version = "^1", features = [
  "tokio-comp",
  "ahash",
  "uuid",
  "json",
  "aio",
] }
# minio: kept on 0.3 for now. 0.4 changes the Client→MinioClient/Builder and
# the bucket-provisioning builder API; migrating is tracked as follow-up work.
minio = "^0.3"
